<title>Найди своё позиционирование</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, step-by-step; marker-yellow highlight is the loud element; topic mix gets its own 4-hue set */
:root{
  --bg:#ECEBF2; --card:#FFFFFF; --ink:#17161F; --muted:#5E5B70; --line:#D6D3E2;
  --accent:#2B45F0; --accent-ink:#FFFFFF; --mark:#FFE45C; --mark-ink:#17161F; --soft:#E2E5FF; --warn:#B4531A;
  --m1:#2B45F0; --m2:#F2C200; --m3:#18A678; --m4:#E0567A; --m5:#8A84A3;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121119; --card:#1C1B26; --ink:#F1F0F7; --muted:#A3A0B8; --line:#33313F;
  --accent:#7D8CFF; --accent-ink:#0E0D15; --mark:#E8CF3F; --mark-ink:#17161F; --soft:#262A4A; --warn:#F0A060;
  --m1:#7D8CFF; --m2:#E8CF3F; --m3:#3CCB98; --m4:#F07C9A; --m5:#8A84A3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121119; --card:#1C1B26; --ink:#F1F0F7; --muted:#A3A0B8; --line:#33313F;
  --accent:#7D8CFF; --accent-ink:#0E0D15; --mark:#E8CF3F; --mark-ink:#17161F; --soft:#262A4A; --warn:#F0A060;
  --m1:#7D8CFF; --m2:#E8CF3F; --m3:#3CCB98; --m4:#F07C9A; --m5:#8A84A3; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-direction:column;gap:10px}
.steplabel{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}

h1,h2{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,7vw,40px)}
h2{font-size:clamp(21px,5.2vw,27px)}
h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0;line-height:1.3;text-wrap:balance}
.hl{background:linear-gradient(transparent 55%, var(--mark) 55%);color:inherit;padding:0 .1em}
p{margin:0}
.lead{font-size:17px;color:var(--muted)}
.screen{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.label{font-weight:700;font-size:16px}
.hint{font-size:14px;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .15s}
textarea{min-height:84px;resize:vertical}
input[type=text]:focus,textarea:focus{border-color:var(--accent)}
::placeholder{color:var(--muted);opacity:.75}

.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{position:relative}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-block;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;transition:background .12s,border-color .12s}
.pick span:hover{border-color:var(--accent)}
.pick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-top:4px}
button,.btn{font:inherit;cursor:pointer;border-radius:12px;padding:13px 20px;font-weight:700;border:1.5px solid transparent;text-decoration:none;display:inline-block;text-align:center}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary:hover:not(:disabled){filter:brightness(1.08)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.ghost:hover{border-color:var(--ink)}
.small{padding:7px 12px;font-size:13px;border-radius:10px}

.intro-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.intro-list li{display:flex;gap:12px;align-items:baseline}
.intro-list .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);min-width:22px}

.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.role{background:var(--mark);color:var(--mark-ink);font-family:var(--f-display);font-weight:700;font-size:15px;padding:6px 12px;border-radius:8px}
.role.second{background:var(--soft);color:var(--ink)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.demo{font-size:14px;background:var(--soft);border-radius:12px;padding:10px 14px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

.variant{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.variant.picked{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.vtype{align-self:flex-start;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;padding:4px 8px;border-radius:6px;background:var(--soft);color:var(--ink)}
.vtype.t2{background:var(--mark);color:var(--mark-ink)}
.vtype.t3{background:var(--ink);color:var(--bg)}
.why{font-size:14px;color:var(--muted);border-left:3px solid var(--mark);padding-left:12px}

/* topic mix */
.mixbar{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px;background:var(--card)}
.mixbar span{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:500;color:#fff;min-width:0;font-variant-numeric:tabular-nums}
.mixbar span.c2{color:#17161F}
.mixlist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.mixlist li{display:grid;grid-template-columns:14px 48px 1fr;gap:4px 10px;align-items:baseline}
.dot{width:12px;height:12px;border-radius:4px;align-self:center}
.pct{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.mixlist b{display:block}
.mixlist .what{font-size:14px;color:var(--muted)}
.c1{background:var(--m1)}.c2{background:var(--m2)}.c3{background:var(--m3)}.c4{background:var(--m4)}.c5{background:var(--m5)}

.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:460px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:8px}}
.formula{font-size:18px;line-height:1.5;font-weight:500}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;padding:10px 6px;border-radius:10px;background:transparent;color:var(--muted);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* profile mock */
.profile{border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg);min-width:0}
.ph{display:flex;gap:16px;align-items:center}
.ava{width:72px;height:72px;border-radius:50%;flex:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:26px;font-weight:700;border:3px solid var(--card);box-shadow:0 0 0 2px var(--mark)}
.stats{display:flex;gap:8px;font-size:12px;color:var(--muted);flex:1;justify-content:space-around;text-align:center;min-width:0}
.stats b{display:block;color:var(--ink);font-size:16px}
.pname{font-weight:700;font-size:15px}
.bio{font-size:14px;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.plink{font-size:14px;color:var(--accent);font-weight:700;overflow-wrap:anywhere}
.follow{background:var(--accent);color:var(--accent-ink);text-align:center;border-radius:8px;padding:7px;font-weight:700;font-size:14px}
.hls{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.hl-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:64px}
.hl-item i{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:16px;color:var(--muted)}
.hl-item span{font-size:11px;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.row>div{min-width:0;flex:1}
.code{font-family:var(--f-mono);font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;white-space:pre-line}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;font-family:var(--f-mono)}

.items{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.items li{display:flex;flex-direction:column;gap:3px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0;padding-bottom:0}
.items .sub{font-size:14px;color:var(--muted)}
.hook{font-size:14px;background:var(--soft);border-radius:8px;padding:6px 10px;align-self:flex-start}

.week{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.week li{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.week li:last-child{border-bottom:0}
.week .d{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.week .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}

.check{display:flex;flex-direction:column;gap:8px}
.check label{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--mark);padding-left:12px}
.toast{font-size:14px;color:var(--accent);font-weight:700}
.err{color:var(--warn);font-weight:700}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

.loading{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:28px 0}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s;background:var(--mark)}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
.cta{background:var(--ink);color:var(--bg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.cta .btn{background:var(--mark);color:var(--mark-ink);align-self:flex-start}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="top" id="top" hidden>
    <div class="steplabel" id="steplabel"></div>
    <div class="bar"><i id="barfill"></i></div>
  </div>
  <main id="app"></main>
</div>

<script>
/* ===== НАСТРОЙКИ: поменяй под себя ===== */
const CONFIG = {
  api: "/api/analyze",
  demo: false,  // true = показывать пример разбора без запроса к серверу
  // Блок в самом конце. Оставь ctaUrl пустым, чтобы его не показывать.
  ctaTitle: "Хочешь, чтобы мы разобрали твой профиль лично?",
  ctaText: "Посмотрим твой аккаунт и скажем, что поменять, чтобы люди подписывались.",
  ctaButton: "Написать нам",
  ctaUrl: ""   // например "https://t.me/username"
};
/* ======================================= */

const ROLE_DESC = {
  "Эксперт":"Ты разбираешься в теме и делишься знаниями, решениями, опытом. К тебе идут за пользой.",
  "Наставник":"Ты ведёшь человека из точки А в точку Б: объясняешь, направляешь и поддерживаешь.",
  "Практик":"Ты пробуешь на себе и показываешь реальный результат. Тебе верят, потому что видят, что работает.",
  "Вдохновляющая личность":"Твоя жизнь, вкус, мысли и опыт. Люди смотрят, потому что хотят так же.",
  "Интертейнер":"Ты создаёшь эмоции: юмор, приколы, тренды. С тобой просто весело."
};

const CHOICES = {
  platforms:{multi:true, opts:["Instagram","TikTok","YouTube","Telegram","ВКонтакте"]},
  camera:{multi:false, opts:["Говорю в камеру","Без лица, голосом","Текст и фото","Пока не знаю"]},
  time:{multi:false, opts:["Пара часов в неделю","3-5 часов в неделю","Каждый день понемногу","Сколько угодно"]},
  goalc:{multi:true, opts:["Реклама и охваты","Продавать свои услуги","Свой продукт или курс","Известность","Просто кайф"]}
};

const STEPS = ["intro","now","dig","you","loading","variants","packing","final"];
const LABELS = {now:"Шаг 1 из 3 · Где ты сейчас",dig:"Шаг 2 из 3 · Копаемся в себе",you:"Шаг 3 из 3 · Какой ты и зачем блог",variants:"Твои варианты",final:"Твоя упаковка"};
const PROGRESS = {now:1,dig:2,you:3,loading:3.5,variants:4,packing:4.5,final:5};

const KEY = "positioning-ai-v2";
const FRESH = () => ({step:0, a:{}, c:{}, result:null, pick:null, pack:null, packFor:null, tab:"pos", bioAlt:false, checks:{}, seen:[]});
let S = FRESH();
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
if(STEPS[S.step]==="loading") S.step = S.result ? 5 : 3;
if(STEPS[S.step]==="packing") S.step = 5;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const app = document.getElementById("app");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const A = k => (S.a[k]||"").trim();

function field(id, label, hint, ph, multi){
  const val = esc(S.a[id]);
  return `<div class="field"><label for="${id}">${label}</label>${hint?`<div class="hint">${hint}</div>`:""}
    ${multi ? `<textarea id="${id}" data-k="${id}" placeholder="${esc(ph)}">${val}</textarea>`
            : `<input type="text" id="${id}" data-k="${id}" placeholder="${esc(ph)}" value="${val}">`}</div>`;
}
function choice(id, label, hint){
  const c = CHOICES[id], sel = S.c[id]||[];
  return `<div class="field" role="group" aria-labelledby="l_${id}"><div class="label" id="l_${id}">${label}</div>${hint?`<div class="hint">${hint}</div>`:""}
    <div class="pick">${c.opts.map((o,i)=>`<label><input type="${c.multi?"checkbox":"radio"}" name="${id}" id="${id}_${i}" data-c="${id}" value="${esc(o)}" ${sel.includes(o)?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div></div>`;
}
const nav = (next, extra) => `<div class="nav"><button class="ghost" data-go="-1">Назад</button><button class="primary" ${extra||'data-go="1"'}>${next||"Дальше"}</button></div>`;

function answers(){
  const a = Object.assign({}, S.a);
  a.platforms = (S.c.platforms||[]).join(", ");
  a.camera = (S.c.camera||[]).join(", ");
  a.time = (S.c.time||[]).join(", ");
  a.goal = [(S.c.goalc||[]).join(", "), A("goal")].filter(Boolean).join(". ");
  return a;
}

function mixBar(mix){
  return `<div class="mixbar" role="img" aria-label="${esc(mix.map(m=>m.percent+"% "+m.topic).join(", "))}">${mix.map((m,i)=>`<span class="c${Math.min(i+1,5)}" style="flex:${Math.max(m.percent,1)}">${m.percent>=12?m.percent+"%":""}</span>`).join("")}</div>`;
}
function mixList(mix, withWhat){
  return `<ul class="mixlist">${mix.map((m,i)=>`<li><i class="dot c${Math.min(i+1,5)}"></i><span class="pct">${m.percent}%</span><div><b>${esc(m.topic)}</b>${withWhat&&m.what?`<span class="what">${esc(m.what)}</span>`:""}</div></li>`).join("")}</ul>`;
}

/* ----- demo data, used only when CONFIG.demo is true ----- */
const DEMO = {
  summary:"Ты уже умеешь смешить: лучше всего у тебя заходят рофлы. А часами ты готова говорить про собак и про уход за волосами, в этом ты реально разбираешься. Юмор есть, знания есть, осталось правильно их смешать.",
  strengths:["Чувство юмора, которое уже набирает просмотры","Свой опыт с собакой без кинолога","Разбираешься в уходе за волосами, друзья спрашивают советы"],
  role:{main:"Интертейнер",second:"Практик",why:"С тобой весело, а то, о чём рассказываешь, ты пробовала на себе. Поэтому тебе будут и смеяться, и верить."},
  variants:[

function render(){
  const name = STEPS[S.step];
  app.innerHTML = VIEWS[name]();

  if(name==="intro"){ top.hidden = true; }

    top.hidden = false;
    document.getElementById("steplabel").textContent = LABELS[name] || "Работаю над разбором";
    document.getElementById("barfill").style.width = (PROGRESS[name]/5*100)+"%";

  window.scrollTo(0,0);
}

        <div><div class="pname">${esc(p.name_field)}</div><div class="bio">${esc(bio)}</div>${p.link?`<div class="plink">ссылка ↗</div>`:""}</div>
        <div class="follow">Подписаться</div>
        ${p.highlights.length?`<div class="hls">${p.highlights.map(h=>`<div class="hl-item"><i>${esc(h.name.charAt(0).toUpperCase())}</i><span>${esc(h.name)}</span></div>`).join("")}</div>`:""}
      </div>
      ${p.bio_alt?`<div class="nav" style="padding:0;justify-content:flex-start"><button class="ghost small" id="bioswap">${S.bioAlt?"Показать вариант 1":"Показать вариант 2 шапки"}</button></div>`:""}
    </div>
    <div class="panel">
      <div class="row"><div><div class="eyebrow">Поле «Имя»</div><p class="hint">По нему тебя находят в поиске, поэтому тут не только имя, но и тема</p></div><button class="ghost small" data-copy="name_field">Скопировать</button></div>
      <div class="code">${esc(p.name_field)}</div>
    </div>
    <div class="panel">
      <div class="row"><div><div class="eyebrow">Шапка, вариант 1</div></div><button class="ghost small" data-copy="bio">Скопировать</button></div>
      <div class="code">${esc(p.bio)}</div>
      ${p.bio_alt?`<div class="row"><div><div class="eyebrow">Шапка, вариант 2</div></div><button class="ghost small" data-copy="bio_alt">Скопировать</button></div><div class="code">${esc(p.bio_alt)}</div>`:""}
    </div>
    ${p.usernames.length?`<div class="panel"><div class="eyebrow">Варианты ника</div><div class="chiprow">${p.usernames.map(u=>`<span class="tag">@${esc(u)}</span>`).join("")}</div><p class="hint">Короткий, легко прочитать и запомнить. Без лишних цифр и точек подряд.</p></div>`:""}
    ${p.avatar?`<div class="panel"><div class="eyebrow">Аватарка</div><p>${esc(p.avatar)}</p></div>`:""}
    ${p.highlights.length?`<div class="panel"><div class="eyebrow">Актуальные</div><ul class="items">${p.highlights.map(h=>`<li><b>${esc(h.name)}</b><span class="sub">${esc(h.what)}</span></li>`).join("")}</ul></div>`:""}
    ${p.link?`<div class="panel"><div class="eyebrow">Ссылка в профиле</div><p>${esc(p.link)}</p></div>`:""}
    ${p.pinned.length?`<div class="panel"><div class="eyebrow">Закрепить 3 публикации</div><ul class="items">${p.pinned.map((x,i)=>`<li><b>${i+1}. ${esc(x.title)}</b><span class="sub">${esc(x.why)}</span></li>`).join("")}</ul></div>`:""}
    ${p.visual?`<div class="panel"><div class="eyebrow">Визуал</div><p>${esc(p.visual)}</p></div>`:""}
    <div class="panel"><h3>Проверь профиль</h3><div class="check">${[
      "Аватарка: видно лицо, понятно, что это живой человек",
      "Поле «Имя»: есть тема, а не только имя",
      "Шапка: за 5 секунд понятно, кто ты, про что тут и зачем подписываться",
      "Актуальные: отвечают на вопросы новичка, без непонятных смайликов",
      "Последние 9 публикаций: видно твои темы, нет каши"
    ].map((c,i)=>chk("pc"+i,c)).join("")}</div>
    <p class="note">Покажи профиль 2-3 знакомым, которые не знают тебя как блогера. Если за 5 секунд они поняли, кто ты и зачем подписываться, значит всё получилось.</p></div>`;
}

function tabCont(v,p){
  const colorOf = t => { const i = v.mix.findIndex(m=>m.topic.toLowerCase()===String(t||"").toLowerCase()); return i<0?"":`<i class="dot c${Math.min(i+1,5)}" style="display:inline-block;margin-right:6px"></i>`; };
  return `${p.pace?`<div class="panel"><div class="eyebrow">Твой ритм</div><p class="formula">${esc(p.pace)}</p><p class="hint">Посчитано под время, которое ты готов(а) тратить. Лучше стабильно так, чем неделю каждый день и потом пропасть на месяц.</p></div>`:""}
    ${p.rubrics.length?`<div class="panel"><div class="eyebrow">Постоянные рубрики</div><p class="hint">По рубрикам тебя узнают и ждут. Плюс не надо каждый раз придумывать, что снять.</p><ul class="items">${p.rubrics.map(x=>`<li><b>${esc(x.name)}</b><span class="sub">${colorOf(x.topic)}${esc(x.topic)} · ${esc(x.freq)}</span><span>${esc(x.what)}</span></li>`).join("")}</ul></div>`:""}
    ${p.week.length?`<div class="panel"><div class="eyebrow">План на первую неделю</div><ul class="week">${p.week.map(w=>`<li><span class="d">${esc(w.day)}</span><div><div class="meta">${colorOf(w.topic)}<span class="hint">${esc(w.topic)} · ${esc(w.format)}</span></div>${esc(w.idea)}</div></li>`).join("")}</ul></div>`:""}
    ${p.first_videos.length?`<div class="panel"><div class="eyebrow">Первые 5 роликов</div><ul class="items">${p.first_videos.map((x,i)=>`<li><b>${i+1}. ${esc(x.title)}</b>${x.hook?`<span class="hook">Начало: ${esc(x.hook)}</span>`:""}<span class="sub">${esc(x.why)}</span></li>`).join("")}</ul></div>`:""}
    ${p.stories.length?`<div class="panel"><div class="eyebrow">Идеи для сторис</div><ul class="plain">${p.stories.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`:""}`;
}

const chk = (id, text) => `<label><input type="checkbox" id="ck_${id}" data-ch="${id}" ${S.checks[id]?"checked":""}><span>${esc(text)}</span></label>`;

function buildCopy(){
  const r = S.result, v = r.variants[S.pick], p = S.pack;
  const L = [];
  L.push("МОЁ ПОЗИЦИОНИРОВАНИЕ","", "Направление: "+v.title, "Роль: "+r.role.main+(r.role.second?" + "+r.role.second:""), "", "Одной фразой:", p.formula, "");
  L.push("Микс тем:", ...v.mix.map(m=>`${m.percent}% ${m.topic}${m.what?" — "+m.what:""}`), "");
  L.push("Для кого: "+v.audience, "Что получают: "+v.value); if(v.money) L.push("Как зарабатывать: "+v.money); L.push("");
  L.push("УПАКОВКА ПРОФИЛЯ","", "Имя в профиле: "+p.name_field, "Ники: "+p.usernames.map(u=>"@"+u).join(", "), "", "Шапка, вариант 1:", p.bio, "");
  if(p.bio_alt) L.push("Шапка, вариант 2:", p.bio_alt, "");
  if(p.avatar) L.push("Аватарка: "+p.avatar);
  if(p.link) L.push("Ссылка: "+p.link);
  if(p.highlights.length) L.push("", "Актуальные:", ...p.highlights.map(h=>`- ${h.name}: ${h.what}`));
  if(p.pinned.length) L.push("", "Закрепить:", ...p.pinned.map((x,i)=>`${i+1}. ${x.title} (${x.why})`));
  if(p.visual) L.push("", "Визуал: "+p.visual);
  L.push("", "КОНТЕНТ"); if(p.pace) L.push("Ритм: "+p.pace);
  if(p.rubrics.length) L.push("", "Рубрики:", ...p.rubrics.map(x=>`- ${x.name} (${x.topic}, ${x.freq}): ${x.what}`));
  if(p.week.length) L.push("", "План на неделю:", ...p.week.map(w=>`${w.day} — ${w.format}, ${w.topic}: ${w.idea}`));
  if(p.first_videos.length) L.push("", "Первые ролики:", ...p.first_videos.map((x,i)=>`${i+1}. ${x.title}\n   Начало: ${x.hook}`));
  if(p.stories.length) L.push("", "Сторис:", ...p.stories.map(s=>"- "+s));
  if(p.dont.length) L.push("", "Не делать:", ...p.dont.map(s=>"- "+s));
  if(p.first_steps.length) L.push("", "Сделать сегодня:", ...p.first_steps.map(s=>"- "+s));
  return L.join("\n");
}

function copyText(text){
  const toast = document.getElementById("toast");
  const fallback = ()=>{ const ta=document.getElementById("copyarea"); ta.hidden=false; ta.value=text; ta.style.minHeight="240px"; ta.focus(); ta.select(); if(toast) toast.textContent="Выдели текст и скопируй"; };
  try{ navigator.clipboard.writeText(text).then(()=>{ if(toast){ toast.textContent="Скопировано"; setTimeout(()=>{toast.textContent=""},2000);} }, fallback); }catch(err){ fallback(); }
}

const PHRASES = {
  loading:["Читаю твои ответы…","Ищу, где пересекается то, что ты делаешь и что любишь…","Подбираю роль…","Смешиваю темы в пропорциях…","Собираю 3 варианта…"],
  packing:["Собираю упаковку…","Придумываю имя профиля и шапку…","Раскладываю актуальные…","Расписываю план на неделю…","Придумываю первые ролики…"]
};
let phraseTimer = null;
function startPhrases(kind){
  let i = 0; clearInterval(phraseTimer);
  phraseTimer = setInterval(()=>{ const el=document.getElementById("lt"); if(el){ i=(i+1)%PHRASES[kind].length; el.textContent=PHRASES[kind][i]; } }, 4000);
}
async function call(payload){
  if(CONFIG.demo){
    await new Promise(r=>setTimeout(r,1500));
    return {ok:true, data: payload.mode==="pack" ? Object.assign({_demo:true}, DEMO_PACK) : Object.assign({_demo:true}, DEMO)};
  }
  try{
    const r = await fetch(CONFIG.api, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
    const data = await r.json().catch(()=>null);
    if(r.ok && data) return {ok:true, data};
    if(data && data.error==="too_empty") return {ok:false, msg:"Ответь хотя бы на пару вопросов, иначе разбирать нечего."};
    return {ok:false, msg:"Не получилось сделать разбор. Попробуй ещё раз через минуту."};
  }catch(e){ return {ok:false, msg:"Нет связи с сервером. Проверь интернет и попробуй ещё раз."}; }
}
function showErr(msg){ const el = document.getElementById("err"); if(el){ el.textContent = msg; el.hidden = false; el.scrollIntoView({block:"center"}); } }

async function analyze(avoid){
  const prev = S.step;
  go("loading"); startPhrases("loading");
  const res = await call({mode:"variants", answers:answers(), avoid});
  clearInterval(phraseTimer);
  if(res.ok && Array.isArray(res.data.variants) && res.data.variants.length){
    S.result = res.data; S.pick = null; S.pack = null; S.packFor = null;
    S.seen = (S.seen||[]).concat(res.data.variants.map(v=>v.title)).slice(-6);
    go("variants");
  }else{ S.step = prev; save(); render(); showErr(res.ok?"Не получилось сделать разбор. Попробуй ещё раз.":res.msg); }
}
async function pack(force){
  const v = S.result.variants[S.pick];
  if(!force && S.pack && S.packFor===v.title){ S.tab="pos"; go("final"); return; }
  const prev = S.step;
  go("packing"); startPhrases("packing");
  const res = await call({mode:"pack", answers:answers(), variant:v, role:S.result.role});
  clearInterval(phraseTimer);
  if(res.ok && res.data && res.data.bio){
    S.pack = res.data; S.packFor = v.title; S.tab = "pos"; S.bioAlt = false;
    go("final");
  }else{ S.step = prev; save(); render(); showErr(res.ok?"Не получилось собрать упаковку. Попробуй ещё раз.":res.msg); }
}

app.addEventListener("input", e=>{ const k = e.target.dataset.k; if(k){ S.a[k] = e.target.value; save(); } });
app.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset.ch!==undefined){ S.checks[t.dataset.ch]=t.checked; save(); }
  if(t.dataset.c){ const id=t.dataset.c; S.c[id] = Array.from(app.querySelectorAll(`input[data-c="${id}"]:checked`)).map(x=>x.value); save(); }
});
app.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.go){ S.step = Math.max(0, Math.min(3, S.step + Number(t.dataset.go))); save(); render(); return; }
  if(t.dataset.pick!==undefined){
    S.pick = Number(t.dataset.pick); save(); render();
    const el = document.querySelectorAll(".variant")[S.pick]; if(el) el.scrollIntoView({block:"center"}); return;
  }
  if(t.dataset.tab){ S.tab = t.dataset.tab; save(); render(); document.querySelector(".tabs").scrollIntoView({block:"start"}); return; }
  if(t.dataset.copy){ copyText(S.pack[t.dataset.copy]||""); return; }
  switch(t.id){
    case "analyze": S.seen = []; analyze([]); break;
    case "more": analyze(S.seen||[]); break;
    case "topack": if(S.pick!=null) pack(false); break;
    case "repack": pack(true); break;
    case "edit": go("now"); break;
    case "back": go("variants"); break;
    case "bioswap": S.bioAlt = !S.bioAlt; save(); render(); document.querySelector(".tabs").scrollIntoView({block:"start"}); break;
    case "copyall": copyText(buildCopy()); break;
    case "reset": document.getElementById("resetbox").innerHTML = `<span>Точно стереть все ответы?</span><button class="ghost small" id="resetyes">Да, стереть</button><button class="ghost small" id="resetno">Нет</button>`; break;
    case "resetno": document.getElementById("resetbox").innerHTML = `<button class="ghost small" id="reset">Начать заново</button>`; break;
    case "resetyes": S = FRESH(); save(); render(); break;
  }
});

render();
</script>
